<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>ironvim</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  :root {
    --bg0:#2c2e34; --bg1:#33353f; --bg2:#363944; --bg3:#3b3e48; --bg4:#414550;
    --fg:#e2e2e3; --red:#fc5d7c; --orange:#f39660; --yellow:#e7c664;
    --green:#9ed072; --blue:#76cce0; --purple:#b39df3; --gray:#7f8490;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg0); color:var(--fg);
    font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    -webkit-text-size-adjust:100%; }
  #root { min-height:100vh; padding-bottom: env(safe-area-inset-bottom); }
  ::selection { background:#b39df355; }
  textarea, input, select { font-family: inherit; }
  /* iOS: inputs must be >=16px or Safari force-zooms on focus */
  textarea.gl-editor, input.gl-input { font-size:16px !important; }
  textarea.gl-editor { scrollbar-width:thin; scrollbar-color:var(--bg4) var(--bg1); }
  textarea.gl-editor::-webkit-scrollbar { width:8px; }
  textarea.gl-editor::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:5px; }
  button.gl-btn, .gl-tap {
    min-height:44px; min-width:44px; background:var(--bg2); border:1px solid var(--bg4);
    color:var(--fg); font-family:inherit; font-size:13px; padding:8px 12px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
  }
  button.gl-btn:active { background:var(--bg3); }
  input.gl-input { background:var(--bg2); border:1px solid var(--bg4); color:var(--fg);
    padding:9px 10px; border-radius:6px; outline:none; min-height:40px; }
  input.gl-input:focus { border-color:var(--blue); }
  code { background:var(--bg2); padding:1px 4px; border-radius:3px; }
  @media (min-width:900px) { .gl-grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; } }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
<!-- pinned + SRI: an unpinned major would silently change the bytes we execute -->
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"
        integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp"></script>
<script src="supabase-config.js"></script>
<script src="workouts.js"></script>
<script src="sync.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const C = {
  bg0:"#2c2e34", bg1:"#33353f", bg2:"#363944", bg3:"#3b3e48", bg4:"#414550",
  fg:"#e2e2e3", red:"#fc5d7c", orange:"#f39660", yellow:"#e7c664",
  green:"#9ed072", blue:"#76cce0", purple:"#b39df3", gray:"#7f8490",
};
/* Sonokai "andromeda" style — used only for the edit-workout highlight layer. */
const A = {
  bg0:"#2b2d3a", bg1:"#333648", bg2:"#363a4e", bg3:"#393e53", bg4:"#3f445b",
  fg:"#e1e3e4", red:"#fb617e", orange:"#f89860", yellow:"#edc763",
  green:"#9ed06c", blue:"#6dcae8", purple:"#bb97ee", gray:"#7e8294",
};

/* ---------------- grammar tables ---------------- */
const ANGLE_LABELS = { i:"Incline", d:"Decline" };
const EQUIP_LABELS = { db:"Dumbbell", ez:"EZ-Bar", m:"Machine", c:"Cable", s:"Smith Machine" };
const EQUIP_CODES = ["db","ez","m","c","s"];
const ANGLE_CODES = ["i","d"];
const BASE_LABELS = {
  p:"Press", c:"Curl", r:"Row", f:"Fly", pd:"Pulldown", tp:"Triceps Pushdown", d:"Delt Raises", t:"Triceps Extension",
  sq:"Squat", dl:"Deadlift", lp:"Leg Press", lc:"Leg Curl", le:"Leg Extension",
  cr:"Calf Raise", lu:"Lunge", pu:"Pull-Up", dip:"Dip", op:"Overhead Press", tb:"T-Bar Row", sh:"Shrug",
};
const RESERVED_MULTI = ["sq","dl","lp","lc","le","cr","ca","lu","pu","di","dip","op","pd","tp","d","e","tb","sh"];
/* retired codes that still parse, so older logs keep resolving. not listed in the reference. */
const BASE_ALIASES = { l:"pd", ca:"cr", e:"d", di:"dip" };
const resolveBase = (code) => BASE_ALIASES[code] || (BASE_LABELS[code] ? code : null);
const DEFAULT_EQUIP = {
  p:"Barbell", c:"Barbell", r:"Barbell", f:"Dumbbell", d:"Dumbbell", e:"Dumbbell", t:"Barbell",
  sq:"Barbell", dl:"Barbell", lu:"Bodyweight", pu:"Bodyweight", dip:"Bodyweight", op:"Barbell",
  lp:"Machine", lc:"Machine", le:"Machine", cr:"Machine", tp:"Cable", tb:"Barbell", sh:"Barbell",
};
const DEFAULT_LEGEND = {
  pd: { v:"V-Bar", s:"Single Handle", rg:"Reverse Grip", ng:"Neutral Grip" },
  tp: { b:"Straight Bar", r:"Rope", v:"V-Bar" },
  t: { r:"Rope", v:"V-Bar", b:"Straight Bar" },
  d: { f:"Front", s:"Side", r:"Rear" },
  lc: { l:"Lying", s:"Seated" },
  lu: { f:"Forward", r:"Reverse", d:"Decline", x:"Deficit" },
  sh: { b:"Behind the Back" },
};
/* default labels retired from the pulldown legend; a saved entry that still
   matches one is dropped so existing installs see only the current set. */
const PULLDOWN_LEGACY = { t:"Triangle", r:"Rope", w:"Wide Bar", b:"Straight Bar" };
const SAMPLE_LOG = `PUSH 09-11
p 135x8,8,6 "felt strong today
idbp 60x10,10,8
ct.r 60x12,12,10
di 25x8,8,6

LEGS 09-12
sq 225x5*5
lc.l 90x12,10,10
lu.r 45x8,8 "reverse lunge, barbell
le 120x12 140x10 160x8 "ascending
lp 400x10,10,8`;

/* ---------------- parser (identical grammar to the chat version) ---------------- */
function decompose(token) {
  if (RESERVED_MULTI.includes(token)) return { angle:null, equipment:null, base:resolveBase(token) };
  for (const eq of EQUIP_CODES) {
    if (token.startsWith(eq)) {
      const rem = token.slice(eq.length);
      if (RESERVED_MULTI.includes(rem)) return { angle:null, equipment:eq, base:resolveBase(rem) };
    }
  }
  for (const a of ANGLE_CODES) {
    if (token.startsWith(a) && !(a === "d" && token.slice(0,2) === "db")) {
      const remA = token.slice(1);
      if (RESERVED_MULTI.includes(remA)) return { angle:a, equipment:null, base:resolveBase(remA) };
      for (const eq of EQUIP_CODES) {
        if (remA.startsWith(eq)) {
          const remB = remA.slice(eq.length);
          if (RESERVED_MULTI.includes(remB)) return { angle:a, equipment:eq, base:resolveBase(remB) };
        }
      }
    }
  }
  let rem = token; let angle = null;
  if (rem[0] === "i") { angle = "i"; rem = rem.slice(1); }
  else if (rem[0] === "d" && rem.slice(0,2) !== "db") { angle = "d"; rem = rem.slice(1); }
  let equipment = null;
  for (const eq of EQUIP_CODES) {
    if (rem.startsWith(eq) && rem.length > eq.length) { equipment = eq; rem = rem.slice(eq.length); break; }
  }
  if (resolveBase(rem) && !RESERVED_MULTI.includes(rem)) return { angle, equipment, base:resolveBase(rem) };
  if (angle) {
    let rem2 = token; let equipment2 = null;
    for (const eq of EQUIP_CODES) {
      if (rem2.startsWith(eq) && rem2.length > eq.length) { equipment2 = eq; rem2 = rem2.slice(eq.length); break; }
    }
    if (resolveBase(rem2) && !RESERVED_MULTI.includes(rem2)) return { angle:null, equipment:equipment2, base:resolveBase(rem2) };
  }
  return null;
}

/* A space separates sets. ">" still parses so older logs keep working.
   Spaces that merely pad a separator (, * x >) are not set breaks, so collapse
   those first, then treat whatever whitespace is left as the real separator. */
function normalizeSets(raw) {
  return raw
    .replace(/\s*>\s*/g, ">")
    .replace(/\s*,\s*/g, ",")
    .replace(/\s*\*\s*/g, "*")
    .replace(/\s*x\s*/gi, "x")
    .trim()
    .split(/\s+/)
    .join(">");
}

function parseSets(str) {
  const segments = str.split(">");
  const sets = [];
  for (const seg of segments) {
    const m = seg.match(/^(\d+(?:\.\d+)?)x(.+)$/i);
    if (!m) return null;
    const weightRaw = m[1];
    const repsParts = m[2].split(",");
    for (const part of repsParts) {
      const starMatch = part.match(/^(\d+)\*(\d+)$/);
      if (starMatch) {
        const repsVal = parseInt(starMatch[1],10); const count = parseInt(starMatch[2],10);
        for (let i=0;i<count;i++) sets.push({ weightRaw, reps:repsVal });
      } else {
        const repsVal = parseInt(part,10);
        if (Number.isNaN(repsVal)) return null;
        sets.push({ weightRaw, reps:repsVal });
      }
    }
  }
  return sets.length ? sets : null;
}

function tryParseExerciseLine(mainPart) {
  const supersetParts = mainPart.split(/\s+\+\s+/);
  const entries = [];
  for (const part of supersetParts) {
    const tokens = part.trim().split(/\s+/);
    if (tokens.length < 2) return null;
    const exerciseToken = tokens[0].toLowerCase();
    const setsToken = normalizeSets(tokens.slice(1).join(" "));
    const [codePart, variationPart] = exerciseToken.split(".");
    const decomposed = decompose(codePart);
    if (!decomposed) return null;
    const sets = parseSets(setsToken);
    if (!sets) return null;
    entries.push({ code:exerciseToken, ...decomposed, variation:variationPart || null, sets });
  }
  return entries;
}

function parseLog(text) {
  const lines = text.split("\n");
  const sessions = [];
  let current = null;
  const ensureSession = (title) => { current = { title, entries:[], notes:[] }; sessions.push(current); };
  lines.forEach((raw, i) => {
    const line = raw.trim();
    if (!line) return;
    if (line.startsWith('"')) { if (!current) ensureSession("Session"); current.notes.push(line.slice(1).trim()); return; }
    let mainPart = line; let note = null;
    const q = line.indexOf('"');
    if (q !== -1) { mainPart = line.slice(0,q).trim(); note = line.slice(q+1).trim(); }
    if (!mainPart) return;
    const parsed = tryParseExerciseLine(mainPart);
    if (parsed) {
      if (!current) ensureSession("Session");
      parsed.forEach((entry) => current.entries.push({ ...entry, note, lineNum:i+1 }));
    } else { ensureSession(mainPart); }
  });
  return sessions;
}

function resolveWeight(weightRaw) {
  return parseFloat(weightRaw);
}
function displayWeight(weightRaw) {
  return `${weightRaw} lb`;
}
function describeExercise(entry, legend) {
  const parts = [];
  if (entry.angle) parts.push(ANGLE_LABELS[entry.angle]);
  const equipLabel = entry.equipment ? EQUIP_LABELS[entry.equipment] : DEFAULT_EQUIP[entry.base];
  if (equipLabel) parts.push(equipLabel);
  parts.push(BASE_LABELS[entry.base] || entry.base);
  let label = parts.join(" ");
  if (entry.variation) {
    const varLabel = (legend[entry.base] && legend[entry.base][entry.variation]) || entry.variation.toUpperCase();
    label += ` (${varLabel})`;
  }
  return label;
}

/* Saved legends are keyed by base code, so a retired code hands its labels to the
   current one. Without this, a legend persisted under the old key would silently
   drop its variation names. */
function migrateLegend(legend) {
  const next = { ...legend };
  Object.entries(BASE_ALIASES).forEach(([old, current]) => {
    if (!next[old]) return;
    next[current] = { ...next[old], ...(next[current] || {}) };
    delete next[old];
  });
  return next;
}

function withDefaultLegend(legend) {
  const migrated = migrateLegend(legend || {});
  if (migrated.lu && migrated.lu.d === "Decline / Deficit") migrated.lu = { ...migrated.lu, d:"Decline" };
  if (migrated.pd) {
    const pd = { ...migrated.pd };
    Object.entries(PULLDOWN_LEGACY).forEach(([code, label]) => {
      if (pd[code] === label) delete pd[code];
    });
    migrated.pd = pd;
  }
  return Object.entries(DEFAULT_LEGEND).reduce((next, [base, defaults]) => ({
    ...next,
    [base]: { ...defaults, ...(next[base] || {}) },
  }), migrated);
}

/* ---------------- session header convention ---------------- */
function sessionHeader(d) {
  const day = d || new Date();
  return `Workout for ${day.getMonth()+1}/${day.getDate()}/${day.getFullYear()}`;
}

/* ---------------- localStorage persistence (swap-in for window.storage) ---------------- */
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : v; } catch(e) { return fallback; } },
  set(key, val) { try { localStorage.setItem(key, val); return true; } catch(e) { return false; } },
};

/* ---------------- UI ---------------- */
function Panel({ title, accent, children, right }) {
  return (
    <div style={{ background:C.bg1, border:`1px solid ${C.bg3}`, borderRadius:8, overflow:"hidden" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 12px", background:C.bg2, borderBottom:`1px solid ${C.bg3}` }}>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <span style={{ width:6, height:6, borderRadius:"50%", background:accent||C.blue, display:"inline-block" }} />
          <span style={{ color:C.gray, fontSize:12.5, letterSpacing:0.3 }}>{title}</span>
        </div>
        {right}
      </div>
      <div style={{ padding:12 }}>{children}</div>
    </div>
  );
}

function GrammarReference() {
  return (
    <div style={{ fontSize:12, display:"flex", flexDirection:"column", gap:10 }}>
      <div style={{ color:C.orange }}>[angle][equipment][base][.variation] weight×reps</div>
      <div><div style={{ color:C.gray, marginBottom:3 }}>angle</div>{Object.entries(ANGLE_LABELS).map(([k,v])=><div key={k}><span style={{color:C.blue}}>{k}</span> = {v}</div>)}</div>
      <div><div style={{ color:C.gray, marginBottom:3 }}>equipment</div>{Object.entries(EQUIP_LABELS).sort(([,a],[,b])=>a.localeCompare(b)).map(([k,v])=><div key={k}><span style={{color:C.blue}}>{k}</span> = {v}</div>)}</div>
      <div><div style={{ color:C.gray, marginBottom:3 }}>base</div>{Object.entries(BASE_LABELS).sort(([,a],[,b])=>a.localeCompare(b)).map(([k,v])=><div key={k}><span style={{color:C.blue}}>{k}</span> = {v}</div>)}</div>
      <div>
        <div style={{ color:C.gray, marginBottom:3 }}>tokens</div>
        <div><span style={{color:C.blue}}>,</span> = next set, same weight</div>
        <div><span style={{color:C.blue}}>space</span> = next set, new weight</div>
        <div><span style={{color:C.blue}}>&gt;</span> = next set, new weight (old form, still parses)</div>
        <div><span style={{color:C.blue}}>*n</span> = repeat for n sets</div>
        <div><span style={{color:C.blue}}>.x</span> = variation (per exercise)</div>
        <div><span style={{color:C.blue}}>"</span> = comment</div>
        <div><span style={{color:C.blue}}>+</span> = superset</div>
      </div>
    </div>
  );
}

function Modal({ title, accent, onClose, children, palette = C }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"#1b1c2199", display:"flex",
      alignItems:"center", justifyContent:"center", padding:12, zIndex:50 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background:palette.bg1, border:`1px solid ${palette.bg4}`,
        borderRadius:8, width:"100%", maxWidth:520, maxHeight:"85vh", display:"flex", flexDirection:"column", overflow:"hidden" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 12px", background:palette.bg2, borderBottom:`1px solid ${palette.bg3}` }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <span style={{ width:6, height:6, borderRadius:"50%", background:accent||palette.blue, display:"inline-block" }} />
            <span style={{ color:palette.gray, fontSize:12.5, letterSpacing:0.3 }}>{title}</span>
          </div>
          <button className="gl-btn" style={{ minHeight:32, minWidth:32, padding:6 }} onClick={onClose}>✕</button>
        </div>
        <div style={{ padding:12, overflowY:"auto" }}>{children}</div>
      </div>
    </div>
  );
}

/* ---------------- workout editor syntax highlighting ---------------- */
const EXERCISE_LINE_RE = /\d+(?:\.\d+)?x\d+(?:\.\d+)?/i;
const NUM_RE = /^\d+(?:\.\d+)?$/i;

function highlightLog(text, activeLine = -1, pal = C) {
  const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return text.split("\n").map((line, i) => {
    let html;
    if (line.trim() === "") {
      html = "";
    } else if (!EXERCISE_LINE_RE.test(line)) {
      html = `<span style="color:${pal.orange}">${esc(line)}</span>`;
    } else {
      let body = line, comment = "";
      const q = line.indexOf('"');
      if (q >= 0) { body = line.slice(0, q); comment = line.slice(q); }

      const m = body.match(/^(\S+)(.*)$/);
      const code = m ? m[1] : body;
      const rest = m ? m[2] : "";

      const dot = code.indexOf(".");
      const base = dot >= 0 ? code.slice(0, dot) : code;
      const variation = dot >= 0 ? code.slice(dot) : "";
      html = `<span style="color:${pal.purple}">${esc(base)}</span>`;
      if (variation) html += `<span style="color:${pal.blue}">${esc(variation)}</span>`;

      let afterX = false, groupStart = true;
      const setRe = /(\d+(?:\.\d+)?|\D)/gi;
      let match;
      while ((match = setRe.exec(rest)) !== null) {
        const tok = match[0];
        if (NUM_RE.test(tok)) {
          html += afterX || !groupStart
            ? `<span style="color:${pal.green}">${esc(tok)}</span>`
            : `<span style="color:${pal.yellow}">${esc(tok)}</span>`;
          groupStart = false; afterX = false;
        } else if (/[xX]/.test(tok)) {
          html += `<span style="color:${pal.gray}">x</span>`;
          afterX = true;
        } else if (tok === "," || tok === "*") {
          html += `<span style="color:${pal.fg}">${esc(tok)}</span>`;
        } else {
          html += esc(tok);
          if (/\s/.test(tok) || tok === ">") { groupStart = true; afterX = false; }
        }
      }

      if (comment) html += `<span style="color:${pal.gray};font-style:italic">${esc(comment)}</span>`;
    }
    if (i === activeLine) html = `<span class="gl-active-line" style="display:inline-block;width:100%;background:${pal.bg1}">${html}</span>`;
    return html;
  }).join("\n");
}

/* The single line intersecting the selection [start, end]: its byte offsets and
   0-based index. Any selected or caret-touched character pulls in the full line,
   so partial selections still resolve to the line they belong to. */
function selectionLine(body, start, end) {
  if (!body) return null;
  const lo = Math.max(0, Math.min(start, end));
  const hi = Math.max(lo, Math.min(body.length, Math.max(start, end)));
  const lineStart = body.lastIndexOf("\n", hi === 0 ? 0 : hi - 1) + 1;
  const nl = body.indexOf("\n", hi);
  const lineEnd = nl === -1 ? body.length : nl;
  if (lo > lineEnd) return null;
  return { lineStart, lineEnd, index: (body.slice(0, lineStart).match(/\n/g) || []).length };
}

/* A line that only has a code token (no weight×reps yet, or a broken set count)
   still resolves to its exercise, so the label follows keystroke by keystroke
   while typing. Headers and unknown tokens stay null. */
function describeFirstToken(mainPart, legend) {
  const token = mainPart.trim().split(/\s+/)[0];
  if (!token) return null;
  const [codePart, variationPart] = token.toLowerCase().split(".");
  const decomposed = decompose(codePart);
  if (!decomposed) return null;
  return describeExercise({ code:token.toLowerCase(), ...decomposed, variation:variationPart || null, sets:[] }, legend);
}

/* Human-readable name of the exercise whose line intersects the selection
   [start, end]. */
function exerciseLabelAtSelection(body, start, end, legend) {
  const lineInfo = selectionLine(body, start, end);
  if (!lineInfo) return null;
  const line = body.slice(lineInfo.lineStart, lineInfo.lineEnd);
  const q = line.indexOf('"');
  const mainPart = (q === -1 ? line : line.slice(0, q)).trim();
  if (!mainPart) return null;
  const parsed = tryParseExerciseLine(mainPart);
  return parsed ? describeExercise(parsed[0], legend) : describeFirstToken(mainPart, legend);
}

function WorkoutModal({ workout, legend, onClose, onChange }) {
  const taRef = useRef(null);
  const preRef = useRef(null);
  const [selection, setSelection] = useState({ start:0, end:0 });
  const syncCaret = () => {
    const el = taRef.current;
    if (!el) return;
    const start = el.selectionStart == null ? 0 : el.selectionStart;
    const end = el.selectionEnd == null ? start : el.selectionEnd;
    setSelection({ start, end });
  };
  useEffect(() => {
    const el = taRef.current;
    if (!el) return;
    el.focus();
    el.setSelectionRange(el.value.length, el.value.length);
    setSelection({ start:el.value.length, end:el.value.length });
  }, [workout.id]);
  const exerciseLabel = useMemo(() => exerciseLabelAtSelection(workout.body, selection.start, selection.end, legend), [workout.body, selection.start, selection.end, legend]);
  const highlighted = useMemo(() => {
    const lineInfo = selectionLine(workout.body, selection.start, selection.end);
    return highlightLog(workout.body, lineInfo ? lineInfo.index : -1, A);
  }, [workout.body, selection.start, selection.end]);
  const syncScroll = () => { if (preRef.current && taRef.current) preRef.current.scrollTop = taRef.current.scrollTop; };
  const metrics = {
    width:"100%", minHeight:260, padding:12, lineHeight:1.6, boxSizing:"border-box",
    fontFamily:"ui-monospace, SFMono-Regular, Menlo, Consolas, monospace", fontSize:16,
  };
  return (
    <Modal title="EDIT WORKOUT" accent={A.green} onClose={onClose} palette={A}>
      <div style={{ position:"relative", background:A.bg0, border:`1px solid ${A.bg3}`, borderRadius:6 }}>
        <pre ref={preRef} className="gl-highlight" aria-hidden="true" style={{
          ...metrics, position:"absolute", inset:0, margin:0, overflow:"hidden",
          whiteSpace:"pre-wrap", wordBreak:"break-all", color:"transparent",
        }} dangerouslySetInnerHTML={{ __html: highlighted }} />
        <textarea
          ref={taRef}
          className="gl-editor"
          value={workout.body}
          onChange={(e) => onChange(workout.id, e.target.value) + syncCaret()}
          onScroll={syncScroll}
          onSelect={syncCaret}
          onKeyUp={syncCaret}
          onClick={syncCaret}
          spellCheck={false}
          autoCapitalize="off"
          autoCorrect="off"
          style={{ ...metrics, position:"relative", resize:"none", overflow:"hidden", borderStyle:"none", borderWidth:0,
            background:"transparent", color:"transparent", caretColor:A.fg, WebkitTextFillColor:"transparent", outline:"none" }}
        />
      </div>
      <div style={{ marginTop:10, paddingTop:8, borderTop:`1px solid ${A.bg3}`, display:"flex", alignItems:"center", justifyContent:"space-between", minHeight:18 }}>
        <span style={{ fontSize:11, color:A.gray, textTransform:"uppercase", letterSpacing:1 }}>exercise</span>
        {exerciseLabel
          ? <span className="gl-exercise-label" style={{ fontSize:12.5, color:A.green, textAlign:"right" }}>{exerciseLabel}</span>
          : <span className="gl-exercise-label" style={{ fontSize:12.5, color:A.gray, fontStyle:"italic" }}>—</span>}
      </div>
      <div style={{ display:"flex", marginTop:10 }}>
        <button className="gl-btn" style={{ flex:1 }} onClick={onClose}>done</button>
      </div>
    </Modal>
  );
}

/* ---------------- cloud sync (state machine lives in sync.js) ---------------- */
const SYNC_LABELS = {
  "local-only": { text:"local only", color:C.gray },
  "signed-out": { text:"local only", color:C.gray },
  syncing:      { text:"↑ syncing",  color:C.blue },
  synced:       { text:"✓ synced",   color:C.green },
  offline:      { text:"⚠ offline",  color:C.yellow },
  conflict:     { text:"⚠ conflict", color:C.red },
};

function useSync({ local, applyRemote }) {
  const [status, setStatus] = useState(() => (window.ironvimSync ? window.ironvimSync.getStatus() : "local-only"));
  const [detail, setDetail] = useState(null);
  const [email, setEmail] = useState(null);
  const [conflict, setConflict] = useState(null);
  /* refs so sync.js always reads current state without re-running init */
  const localRef = useRef(local);
  const applyRef = useRef(applyRemote);
  localRef.current = local;
  applyRef.current = applyRemote;

  useEffect(() => {
    const sync = window.ironvimSync;
    if (!sync) return;
    sync.init({
      getLocal: () => localRef.current,
      applyRemote: (remote) => applyRef.current(remote),
      onStatus: (s, d) => { setStatus(s); setDetail(d); },
      onConflict: (c) => setConflict(c),
      onAuth: (addr) => setEmail(addr),
    });
  }, []);

  return { status, detail, email, conflict };
}

function App() {
  const workoutApi = window.ironvimWorkouts;
  const [workouts, setWorkouts] = useState(() => workoutApi
    ? workoutApi.loadLocalWorkouts(localStorage, parseLog, new Date())
    : [{ id:"local-workout", body:SAMPLE_LOG, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), revision:null, dirty:true }]);
  const [editingId, setEditingId] = useState(null);
  const [legend, setLegend] = useState(() => {
    const raw = store.get("ironvim-logs-legend", null);
    try { return withDefaultLegend(raw ? JSON.parse(raw) : DEFAULT_LEGEND); } catch(e) { return withDefaultLegend(DEFAULT_LEGEND); }
  });
  const [showSample, setShowSample] = useState(false);
  const [showGrammar, setShowGrammar] = useState(false);
  const [grammarTab, setGrammarTab] = useState("syntax");
  const [newLegend, setNewLegend] = useState({ base:"", code:"", label:"" });
  const [saved, setSaved] = useState(false);
  const [acct, setAcct] = useState({ email:"", sent:false, busy:false, error:null });
  /* adopting a remote copy must not be pushed straight back up, and the
     mount-time save must not mark the log dirty when nothing was edited */
  const skipNotify = useRef(false);
  const firstSave = useRef(true);

  const applyRemote = useCallback((remote) => {
    skipNotify.current = true;
    setWorkouts(remote.workouts || []);
    setLegend(withDefaultLegend(remote.legend || {}));
  }, []);

  const sync = useSync({
    local: { workouts, legend, untouched: workouts.length === 1 && workouts[0].body === SAMPLE_LOG },
    applyRemote,
  });
  const syncLabel = SYNC_LABELS[sync.status] || SYNC_LABELS["local-only"];
  const localOnly = sync.status === "local-only" || sync.status === "signed-out";
  const editingWorkout = workouts.find((w) => w.id === editingId) || null;

  const acctAction = useCallback((fn, onDone) => {
    setAcct((a) => ({ ...a, busy:true, error:null }));
    fn().then(() => setAcct((a) => ({ ...onDone(a), busy:false, error:null })))
        .catch((e) => setAcct((a) => ({ ...a, busy:false, error:(e && e.message) || String(e) })));
  }, []);

  const addSession = useCallback(() => {
    const workout = workoutApi
      ? workoutApi.createWorkout(sessionHeader() + "\n")
      : { id:"local-workout", body:sessionHeader() + "\n", createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), revision:null, dirty:true };
    setWorkouts((prev) => [...prev, workout]);
    setEditingId(workout.id);
  }, [workoutApi]);

  const updateWorkout = useCallback((id, value) => {
    setWorkouts((prev) => prev.map((workout) => workout.id === id
      ? { ...workout, body:value, updatedAt:new Date().toISOString(), dirty:true }
      : workout));
  }, []);

  const editWorkout = useCallback((id) => setEditingId(id), []);

  useEffect(() => {
    const h = setTimeout(() => {
      if (workoutApi) workoutApi.saveLocalWorkouts(localStorage, workouts);
      store.set("ironvim-logs-legend", JSON.stringify(legend));
      setSaved(true);
      setTimeout(() => setSaved(false), 1200);
      if (firstSave.current) firstSave.current = false;
      else if (skipNotify.current) skipNotify.current = false;
      else if (window.ironvimSync) window.ironvimSync.notifyChange();
    }, 500);
    return () => clearTimeout(h);
  }, [workouts, legend, workoutApi]);

  const sessions = useMemo(() => workouts.map((workout) => ({
    ...workout,
    parsed: parseLog(workout.body),
  })), [workouts]);

  const allTime = useMemo(() => {
    const map = {}; let totalVolume = 0; let totalSets = 0;
    sessions.forEach((workout) => workout.parsed.forEach((s) => s.entries.forEach((entry) => {
      const label = describeExercise(entry, legend);
      if (!map[label]) map[label] = { maxWeight:null, volume:0, sets:0 };
      entry.sets.forEach((set) => {
        const w = resolveWeight(set.weightRaw);
        totalSets += 1; map[label].sets += 1;
        if (w != null) {
          const vol = w * set.reps;
          map[label].volume += vol; totalVolume += vol;
          if (map[label].maxWeight == null || w > map[label].maxWeight) map[label].maxWeight = w;
        }
      });
    })));
    const rows = Object.entries(map).map(([label,v]) => ({ label, ...v })).sort((a,b) => b.volume - a.volume);
    return { rows, totalVolume, totalSets, sessionCount: sessions.reduce((n, workout) => n + workout.parsed.length, 0) };
  }, [sessions, legend]);
  const maxRowVolume = allTime.rows.length ? allTime.rows[0].volume : 1;

  const addLegendEntry = useCallback(() => {
    const { base, code, label } = newLegend;
    if (!base.trim() || !code.trim() || !label.trim()) return;
    setLegend((prev) => ({ ...prev, [base.trim()]: { ...(prev[base.trim()]||{}), [code.trim()]: label.trim() } }));
    setNewLegend({ base:"", code:"", label:"" });
  }, [newLegend]);
  const removeLegendEntry = (base, code) => {
    setLegend((prev) => { const next = { ...prev }; const f = { ...(next[base]||{}) }; delete f[code]; next[base] = f; return next; });
  };

  return (
    <div style={{ background:C.bg0, color:C.fg, minHeight:"100vh", padding:12, maxWidth:1100, margin:"0 auto" }}>
      {/* title bar */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12, padding:"10px 12px", background:C.bg1, border:`1px solid ${C.bg3}`, borderRadius:8 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <span style={{ width:10, height:10, borderRadius:"50%", background:C.red, display:"inline-block" }} />
          <span style={{ width:10, height:10, borderRadius:"50%", background:C.yellow, display:"inline-block" }} />
          <span style={{ width:10, height:10, borderRadius:"50%", background:C.green, display:"inline-block" }} />
          <span style={{ marginLeft:8, color:C.gray, fontSize:13 }}>~/ironvim</span>
        </div>
        <span title={sync.detail || ""} style={{ color:(saved && localOnly) ? C.green : syncLabel.color, fontSize:11 }}>
          {(saved && localOnly) ? "✓ saved" : syncLabel.text}
        </span>
      </div>

      <div className="gl-grid" style={{ display:"flex", flexDirection:"column", gap:12 }}>
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <Panel title="LOG" accent={C.green}>
            <div style={{ color:C.gray, fontSize:12, marginBottom:10 }}>
              Tap <span style={{ color:C.blue }}>edit</span> on a session to change its text.
            </div>
            <div style={{ display:"flex", marginTop:10 }}>
              <button className="gl-btn" style={{ flex:1, borderColor:C.green, color:C.green }} onClick={addSession}>+ new workout</button>
            </div>
            <div style={{ display:"flex", gap:8, marginTop:8 }}>
              <button className="gl-btn" style={{ flex:1 }} onClick={() => setShowSample(true)}>ⓘ sample</button>
              <button className="gl-btn" style={{ flex:1 }} onClick={() => { setGrammarTab("syntax"); setShowGrammar(true); }}>? grammar</button>
              <button className="gl-btn" style={{ flex:1 }} onClick={() => { setGrammarTab("variations"); setShowGrammar(true); }}>≡ legend</button>
            </div>
          </Panel>

          <Panel title="PARSED SESSIONS" accent={C.blue}>
            {sessions.length === 0 && <div style={{ color:C.gray, fontSize:13 }}>No entries yet.</div>}
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {sessions.flatMap((workout) => workout.parsed.map((session, si) => {
                const sessionVolume = session.entries.reduce((acc, entry) => acc + entry.sets.reduce((a,set) => {
                  const w = resolveWeight(set.weightRaw); return a + (w != null ? w * set.reps : 0);
                }, 0), 0);
                return (
                  <div key={`${workout.id}-${si}`} style={{ border:`1px solid ${C.bg3}`, borderRadius:6, overflow:"hidden" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", background:C.bg2, padding:"6px 10px", borderBottom:`1px solid ${C.bg3}` }}>
                      <span style={{ color:C.orange, fontSize:13 }}>{session.title}</span>
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                        <span style={{ color:C.gray, fontSize:11.5 }}>{sessionVolume.toLocaleString()} lb</span>
                        <button className="gl-btn" style={{ minHeight:30, minWidth:48, padding:"4px 8px" }} onClick={() => editWorkout(workout.id)}>edit</button>
                      </div>
                    </div>
                    {session.entries.map((entry, ei) => (
                      <div key={ei} style={{ padding:"8px 10px", borderTop: ei===0 ? "none" : `1px solid ${C.bg3}` }}>
                        <div style={{ color:C.fg, fontSize:13 }}>{describeExercise(entry, legend)}</div>
                        <div style={{ color:C.gray, fontSize:10.5, marginBottom:4 }}>{entry.code}{entry.variation ? `.${entry.variation}` : ""}</div>
                        <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-start", gap:3, margin:0 }}>
                          {entry.sets.map((set, wi) => (
                            <div key={wi} style={{ display:"flex", alignItems:"baseline", gap:8, fontSize:12.5 }}>
                              <span style={{ color:C.gray, width:18 }}>{wi + 1}</span>
                              <span style={{ color:C.blue }}>{displayWeight(set.weightRaw)}<span style={{ color:C.gray }}>×</span>{set.reps}</span>
                            </div>
                          ))}
                        </div>
                        {entry.note && <div style={{ color:C.purple, fontStyle:"italic", fontSize:11.5, marginTop:3 }}>{entry.note}</div>}
                      </div>
                    ))}
                  </div>
                );
              }))}
            </div>
          </Panel>
        </div>

        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <Panel title="ALL-TIME SUMMARY" accent={C.orange}>
            <div style={{ display:"flex", gap:16, marginBottom:10, fontSize:12.5, flexWrap:"wrap" }}>
              <div><span style={{ color:C.gray }}>sessions </span><span style={{ color:C.green }}>{allTime.sessionCount}</span></div>
              <div><span style={{ color:C.gray }}>sets </span><span style={{ color:C.green }}>{allTime.totalSets}</span></div>
              <div><span style={{ color:C.gray }}>volume </span><span style={{ color:C.green }}>{allTime.totalVolume.toLocaleString()} lb</span></div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {allTime.rows.map((row,i) => (
                <div key={i}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:12 }}>
                    <span>{row.label}</span><span style={{ color:C.gray }}>{row.maxWeight != null ? `${row.maxWeight} lb max` : "—"}</span>
                  </div>
                  <div style={{ height:5, background:C.bg2, borderRadius:3, marginTop:3, overflow:"hidden" }}>
                    <div style={{ width:`${Math.max(4,(row.volume/maxRowVolume)*100)}%`, height:"100%", background:C.blue }} />
                  </div>
                </div>
              ))}
            </div>
          </Panel>

          <Panel title="ACCOUNT" accent={C.purple}>
            {sync.status === "local-only" ? (
              <div style={{ color:C.gray, fontSize:12 }}>
                Cloud sync is not configured. The log is saved on this device only.
              </div>
            ) : sync.email ? (
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
                <span style={{ fontSize:12, overflowWrap:"anywhere" }}>
                  <span style={{ color:C.gray }}>signed in as </span>{sync.email}
                </span>
                <button className="gl-btn" disabled={acct.busy}
                  onClick={() => acctAction(() => window.ironvimSync.signOut(),
                    () => ({ email:"", sent:false }))}>sign out</button>
              </div>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                <div style={{ color:C.gray, fontSize:12 }}>
                  Sync this log across devices. We will email you a sign-in link.
                </div>
                <div style={{ display:"flex", gap:6 }}>
                  <input className="gl-input" style={{ flex:1, minWidth:0 }} value={acct.email}
                    onChange={(e) => setAcct((a) => ({ ...a, email:e.target.value }))}
                    type="email" inputMode="email" autoCapitalize="off" autoCorrect="off"
                    placeholder="you@email.com" />
                  <button className="gl-btn" disabled={acct.busy || !acct.email.trim()}
                    onClick={() => acctAction(() => window.ironvimSync.sendCode(acct.email),
                      (a) => ({ ...a, sent:true }))}>{acct.sent ? "resend link" : "email sign-in link"}</button>
                </div>
                {acct.sent && (
                  <div style={{ color:C.gray, fontSize:12 }}>
                    Check your email and open the sign-in link to continue.
                  </div>
                )}
                {acct.error && <div style={{ color:C.red, fontSize:11.5 }}>{acct.error}</div>}
              </div>
            )}
          </Panel>

        </div>
      </div>

      {showSample && (
        <Modal title="SAMPLE WORKOUT" accent={C.green} onClose={() => setShowSample(false)}>
          <div style={{ color:C.gray, fontSize:12, marginBottom:10 }}>
            An example of the log format. Tap <span style={{ color:C.blue }}>? grammar</span> for the full syntax.
          </div>
          <pre style={{ margin:0, background:C.bg0, border:`1px solid ${C.bg3}`, borderRadius:6,
            padding:12, fontSize:12.5, lineHeight:1.6, color:C.fg, whiteSpace:"pre-wrap", overflowX:"auto" }}>{SAMPLE_LOG}</pre>
        </Modal>
      )}

      {showGrammar && (
        <Modal title="GRAMMAR" accent={C.blue} onClose={() => setShowGrammar(false)}>
          <div style={{ display:"flex", gap:6, marginBottom:12 }}>
            <button className="gl-btn" style={{ flex:1, borderColor:grammarTab === "syntax" ? C.blue : C.bg4, color:grammarTab === "syntax" ? C.blue : C.gray }}
              onClick={() => setGrammarTab("syntax")}>syntax</button>
            <button className="gl-btn" style={{ flex:1, borderColor:grammarTab === "variations" ? C.purple : C.bg4, color:grammarTab === "variations" ? C.purple : C.gray }}
              onClick={() => setGrammarTab("variations")}>variations</button>
          </div>
          {grammarTab === "syntax" ? <GrammarReference /> : (
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {Object.entries(legend).map(([base,codes]) => Object.keys(codes).length>0 && (
                <div key={base}>
                  <div style={{ color:C.orange, fontSize:12, marginBottom:4 }}>{BASE_LABELS[base]||base} <span style={{ color:C.gray }}>({base}.)</span></div>
                  {Object.entries(codes).map(([code,label]) => (
                    <div key={code} style={{ display:"flex", justifyContent:"space-between", fontSize:12, padding:"4px 0" }}>
                      <span><span style={{ color:C.blue }}>.{code}</span> = {label}</span>
                      <button onClick={() => removeLegendEntry(base,code)} style={{ background:"none", border:"none", color:C.gray, minHeight:28, minWidth:28 }}>✕</button>
                    </div>
                  ))}
                </div>
              ))}
              <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:6 }}>
                <input className="gl-input" placeholder="base" style={{ width:60 }} value={newLegend.base} onChange={(e)=>setNewLegend(n=>({...n, base:e.target.value.toLowerCase()}))} />
                <input className="gl-input" placeholder="code" style={{ width:60 }} value={newLegend.code} onChange={(e)=>setNewLegend(n=>({...n, code:e.target.value.toLowerCase()}))} />
                <input className="gl-input" placeholder="label" style={{ flex:1, minWidth:90 }} value={newLegend.label} onChange={(e)=>setNewLegend(n=>({...n, label:e.target.value}))} />
                <button className="gl-btn" onClick={addLegendEntry}>+</button>
              </div>
            </div>
          )}
        </Modal>
      )}

      {/* onClose is deliberately inert: a stray backdrop tap must not discard a workout */}
      {sync.conflict && (
        <Modal title="SYNC CONFLICT" accent={C.red} onClose={() => {}}>
          <div style={{ color:C.gray, fontSize:12, marginBottom:10 }}>
            This device and the cloud both changed since the last sync. Nothing has been
            overwritten yet. Affected workout: <span style={{ color:C.orange }}>{sync.conflict.workoutId}</span>
          </div>
          {[["this device", sync.conflict.local.body], ["cloud copy", sync.conflict.remote.body]].map(([label, body]) => (
            <div key={label} style={{ marginBottom:10 }}>
              <div style={{ color:C.orange, fontSize:11.5, marginBottom:4 }}>{label}</div>
              <pre style={{ margin:0, background:C.bg0, border:`1px solid ${C.bg3}`, borderRadius:6,
                padding:10, fontSize:11.5, lineHeight:1.5, color:C.fg, whiteSpace:"pre-wrap",
                maxHeight:140, overflowY:"auto" }}>{body}</pre>
            </div>
          ))}
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            <button className="gl-btn" style={{ flex:1 }}
              onClick={() => window.ironvimSync.resolveConflict({ workoutId:sync.conflict.workoutId, choice:"mine" })}>keep mine</button>
            <button className="gl-btn" style={{ flex:1 }}
              onClick={() => window.ironvimSync.resolveConflict({ workoutId:sync.conflict.workoutId, choice:"cloud" })}>use cloud</button>
            <button className="gl-btn" style={{ flex:1, borderColor:C.green, color:C.green }}
              onClick={() => window.ironvimSync.resolveConflict({ workoutId:sync.conflict.workoutId, choice:"both" })}>keep both</button>
          </div>
        </Modal>
      )}

      {editingWorkout && (
        <WorkoutModal workout={editingWorkout} legend={legend} onClose={() => setEditingId(null)} onChange={updateWorkout} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
